name: Deploy DEV (FTPS)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload via FTPS (incremental)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: archa.com.br
          username: devarcha@dev.archa.com.br
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          security: loose

          local-dir: ./
          server-dir: ./
         
          state-name: ftp-deploy-sync-state.json    
          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**

