name: Deploy DEV (SSH)

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Sync files via SSH (rsync)
        uses: SamKirkland/web-deploy@v1
        with:
          target-server: archa.com.br
          remote-user: SSH_USER
          private-ssh-key: ${{ secrets.SSH_KEY }}
          ssh-port: 22
          source-path: ./
          destination-path: /home/studi0976/dev.archa.com.br/

