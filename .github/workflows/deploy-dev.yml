name: Deploy DEV (FTPS)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTPS (incremental)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: archa.com.br
          username: devarcha@dev.archa.com.br
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          security: loose

          local-dir: ./
          server-dir: ./

          state-name: ftp-deploy-sync-state.json

          # mais folga para FTP “nervoso”
          timeout: 600000
          log-level: standard

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.vscode/**
            **/.idea/**
            **/*.log
            # opcionais para reduzir peso:
            # **/images/**
            # **/fonts/**
            # **/Documentation/**
